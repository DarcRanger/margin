name: Track Statistics

on:
  schedule:
    # Run daily every morning at 12:00 UTC (8:00 AM EDT)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  track-stats:
    name: Update GitHub Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect statistics
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/track_stats.py

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/history.json
          if git diff --staged --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "chore(stats): update download statistics"
            git push
            echo "Triggering site deployment to publish updated stats..."
            gh workflow run deploy.yml --ref main || echo "Failed to trigger deploy workflow"
          fi
