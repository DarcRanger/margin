name: CI

on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "stats/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "stats/**"

jobs:
  # Temporary lockfile-only remediation artifact for the maintenance pass.
  dependency-remediation:
    name: "Dependency remediation preview"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Generate non-breaking lockfile fixes
        working-directory: ui
        run: |
          npm ci
          npm audit fix --package-lock-only

      - name: Upload remediated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: remediated-package-lock
          path: ui/package-lock.json
          if-no-files-found: error

      - name: Verify remediated dependency audit
        working-directory: ui
        run: npm audit --audit-level=high

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: "Backend (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Smoke-test imports
        # Confirms all modules resolve without a running LM Studio instance
        run: |
          python -c "from api.main import app; print('app imported OK')"
          python -c "from api.services.file_storage import storage; print('storage OK')"
          python -c "from api.routers.workspace import router; print('workspace OK')"
          python -c "import llm; print('llm OK')"

      - name: Run backend quality gate
        run: python scripts/margin_test.py --quick

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: "Frontend (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["20"]

    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit high-severity dependency findings
        run: npm run audit:ci

      - name: Type-check
        run: npm run build -- --emptyOutDir

      - name: Lint
        run: npm run lint

  # ── Real-browser Pilot lifecycle ─────────────────────────────────────────
  browser-pilot:
    name: "Browser Pilot lifecycle (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install application dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci --prefix ui

      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: npx --prefix ui playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx --prefix ui playwright install chromium

      - name: Run isolated browser acceptance
        run: npm run test:browser --prefix ui

  # ── Windows launcher lifecycle ───────────────────────────────────────────
  windows-launch:
    name: "Windows launch, quit, and relaunch"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify fresh start, clean quit, and relaunch
        shell: powershell
        run: .\scripts\test_windows_launch.ps1

  # ── Path-safety unit tests ────────────────────────────────────────────────
  # Lightweight cross-platform sanity check for the path-handling helpers.
  path-safety:
    name: "Path safety (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Verify posix path helper
        shell: python
        env:
          PYTHONPATH: .
        run: |
          from pathlib import Path
          from api.services.file_storage import _posix_rel

          base = Path("/tmp/ws")
          child = base / "chapters" / "chapter-1.md"
          result = _posix_rel(child, base)
          assert result == "chapters/chapter-1.md", f"Got: {result!r}"
          assert "\\" not in result, "Backslash found in posix path!"
          print("posix path helper OK:", result)
